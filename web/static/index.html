<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ss — skills, prompts, plugins</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              gh: {
                bg: "#ffffff",
                muted: "#f6f8fa",
                border: "#d0d7de",
                text: "#1f2328",
                subtle: "#656d76",
                link: "#0969da",
                pillBg: "#dafbe1",
                pillText: "#1f883d",
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body class="bg-gh-bg text-gh-text min-h-screen flex flex-col" x-data="app()" x-init="init()">

    <!-- Top bar -->
    <header class="bg-gh-muted border-b border-gh-border px-4 py-2 flex items-center gap-3 text-sm">
        <span class="font-semibold text-gh-text">ss</span>
        <input type="text" x-model="globalQuery" @input.debounce.250ms="runSearch()" placeholder="Search skills, prompts, plugins…"
               class="flex-1 max-w-md px-2 py-1 border border-gh-border rounded bg-white text-gh-text focus:outline-none focus:border-gh-link"/>
        <button class="text-xs text-gh-subtle hover:text-gh-text border border-gh-border rounded px-2 py-0.5"
                @click="openCmdK()" title="Press ⌘K">⌘K</button>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Left rail -->
        <aside class="w-56 bg-gh-muted border-r border-gh-border text-sm overflow-y-auto">
            <nav class="p-2 space-y-3">
                <div>
                    <div class="text-[11px] uppercase text-gh-subtle font-semibold px-2 mb-1">Library</div>
                    <a href="#/skills" class="rail-link" :class="{'rail-link-active': route === 'skills'}">Skills <span class="text-gh-subtle text-xs" x-text="counts.skills"></span></a>
                    <a href="#/prompts" class="rail-link" :class="{'rail-link-active': route.startsWith('prompts')}">Prompts <span class="text-gh-subtle text-xs" x-text="counts.prompts"></span></a>
                    <a href="#/plugins" class="rail-link" :class="{'rail-link-active': route === 'plugins'}">Plugins <span class="text-gh-subtle text-xs" x-text="counts.plugins"></span></a>
                </div>
                <div>
                    <div class="text-[11px] uppercase text-gh-subtle font-semibold px-2 mb-1">Groups</div>
                    <template x-for="g in groups" :key="g.Name">
                        <a :href="'#/groups/' + g.Name" class="rail-link" :class="{'rail-link-active': route === 'groups/' + g.Name}" x-text="g.Name"></a>
                    </template>
                    <a href="#/groups" class="rail-link text-gh-subtle" :class="{'rail-link-active': route === 'groups'}">+ Manage</a>
                </div>
                <div>
                    <div class="text-[11px] uppercase text-gh-subtle font-semibold px-2 mb-1">System</div>
                    <a href="#/status" class="rail-link" :class="{'rail-link-active': route === 'status'}">Loaded</a>
                    <a href="#/marketplaces" class="rail-link" :class="{'rail-link-active': route === 'marketplaces'}">Marketplaces</a>
                </div>
            </nav>
        </aside>

        <!-- Main list pane -->
        <main class="flex-1 overflow-y-auto" id="list-pane">
            <div x-show="loading" class="p-6 text-gh-subtle text-sm">Loading…</div>
            <div id="page-content" x-show="!loading"></div>
        </main>

        <!-- Right detail pane -->
        <aside class="w-80 border-l border-gh-border bg-gh-muted overflow-y-auto" id="detail-pane">
            <div x-show="!detail.kind" class="p-6 text-gh-subtle text-xs">
                Select an item on the left to see its details.
            </div>
            <div x-show="detail.kind" id="detail-content" class="p-4 text-sm"></div>
        </aside>
    </div>

    <!-- ⌘K palette -->
    <dialog id="cmdk" aria-label="Command palette" class="rounded-lg border border-gh-border shadow-lg p-0 w-[480px]">
        <form method="dialog" class="contents">
            <input type="text" id="cmdk-input" placeholder="Type to search…"
                   class="w-full px-4 py-3 text-sm border-b border-gh-border focus:outline-none"
                   @input.debounce.150ms="runCmdKQuery($event.target.value)" />
            <ul id="cmdk-list" role="listbox" class="max-h-72 overflow-y-auto text-sm">
                <template x-for="(h, i) in cmdkHits" :key="h.Kind + ':' + h.Name">
                    <li class="px-4 py-2 hover:bg-gh-muted cursor-pointer flex justify-between"
                        :class="{'bg-gh-muted': cmdkActive === i}"
                        @click="runCmdKChoice(h)">
                        <span><span class="text-gh-subtle text-xs uppercase mr-2" x-text="h.Kind"></span><span x-text="h.Name"></span></span>
                        <span class="text-gh-subtle text-xs truncate ml-2" x-text="h.Description"></span>
                    </li>
                </template>
                <li x-show="cmdkHits.length === 0" class="px-4 py-3 text-gh-subtle text-xs">No results.</li>
            </ul>
        </form>
    </dialog>

    <!-- Toast -->
    <div x-show="toast.visible" x-cloak class="fixed bottom-4 right-4 px-3 py-2 rounded shadow text-sm border"
         :class="toast.kind === 'error' ? 'bg-red-50 text-red-700 border-red-200' : 'bg-green-50 text-green-700 border-green-200'"
         x-text="toast.message"></div>

    <script src="/api.js"></script>
    <script src="/components/markdown.js"></script>
    <script src="/components/filter-bar.js"></script>
    <script src="/components/detail-panel.js"></script>
    <script src="/pages/skills.js"></script>
    <script src="/pages/prompts.js"></script>
    <script src="/pages/plugins.js"></script>
    <script src="/pages/groups.js"></script>
    <script src="/pages/marketplaces.js"></script>
    <script src="/pages/search.js"></script>
    <script src="/app.js"></script>
</body>
</html>
